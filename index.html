<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dodgem Arena</title>

  <style>
    /* --------------------------------------------------------
       PAGE LAYOUT
       --------------------------------------------------------
       The browser page simply acts as a container for the
       p5.js canvas. All game UI is drawn inside p5.js.
    -------------------------------------------------------- */

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #16181c;
    }

    body {
      display: flex;

      justify-content: center;
      align-items: center;
    }

    /* Keep the 1600 x 900 p5.js canvas responsive. */
    canvas {
      display: block;

      max-width: 100vw;
      max-height: 100vh;

      width: auto !important;
      height: auto !important;
    }
  </style>
</head>

<body>

  <!-- ======================================================
       LIBRARIES
       ====================================================== -->


  <!-- p5.js
       Provides graphics, animation, input and the main
       sketch lifecycle: setup(), draw(), etc.
  -->
  <script src="p5.min.js"></script>


  <!-- p5.sound
     IMPORTANT:
     Must be loaded AFTER p5.js and BEFORE sketch.js.

     Phase 3 uses:
       - p5.Oscillator
       - userStartAudio()

     p5.Envelope is deliberately NOT used because the
     sound system performs attack/release ramps directly
     through p5.Oscillator.amp().
  -->
  <script src="p5.sound.min.js"></script>


  <!-- Matter.js
       Provides the physics simulation and collision system.
  -->
  <script src="matter.min.js"></script>


  <!-- ======================================================
       DODGEM ARENA
       ======================================================

       sketch.js is loaded last because it depends upon:

         p5.js
         p5.sound
         Matter.js
  -->
  <script src="sketch.js"></script>

</body>

</html>
